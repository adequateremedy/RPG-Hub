<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Solus Dynasty RPG — Hub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: Georgia, "Times New Roman", serif;
            background: #111;
            color: #eee;
        }

        body {
            min-height: 100vh;
        }

        #app {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .panel {
            width: min(900px, 100%);
            background: rgba(20, 20, 20, 0.96);
            border: 1px solid #444;
            border-radius: 14px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        h1,
        h2 {
            margin-top: 0;
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            letter-spacing: 0.08em;
        }

        h2 {
            margin-top: 35px;
            margin-bottom: 18px;
        }

        .subtitle {
            text-align: center;
            opacity: 0.75;
            margin-bottom: 35px;
        }

        .hidden {
            display: none !important;
        }

        button {
            border: 1px solid #777;
            background: #222;
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
        }

        button:hover {
            background: #333;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #loginScreen {
            text-align: center;
        }

        #googleSignInButton {
            display: block;
            margin: 25px auto 0;
            min-width: 240px;
        }

        #loadingScreen {
            text-align: center;
        }

        #playerScreen {
            display: none;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #444;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .player-name {
            font-size: 1.4rem;
        }

        .player-email {
            opacity: 0.7;
            font-size: 0.9rem;
        }

        .welcome-message {
            text-align: center;
            margin: 25px 0 30px;
            line-height: 1.6;
        }

        .stats-section {
            margin-top: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(160px, 1fr)
            );
            gap: 15px;
        }

        .stat-card {
            border: 1px solid #444;
            border-radius: 10px;
            padding: 18px;
            background: #191919;
        }

        .stat-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            opacity: 0.65;
            margin-bottom: 7px;
        }

        .stat-value {
            font-size: 1.2rem;
        }

        .actions-section {
            margin-top: 35px;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(220px, 1fr)
            );
            gap: 15px;
        }

        .action-button {
            min-height: 90px;
            text-align: left;
        }

        .action-title {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .action-description {
            display: block;
            font-size: 0.85rem;
            opacity: 0.7;
        }

        #errorMessage {
            text-align: center;
            color: #ffb0b0;
            margin-top: 20px;
            white-space: pre-line;
        }
    </style>
</head>

<body>

<div id="app">

    <main class="panel">

        <!-- ==================================================
             LOGIN SCREEN
             ================================================== -->

        <section id="loginScreen">

            <h1>Solus Dynasty RPG</h1>

            <p class="subtitle">
                RPG Hub
            </p>

            <p>
                Sign in with your Google account to access
                your RPG progress.
            </p>

            <button
                id="googleSignInButton"
                type="button"
            >
                Sign in with Google
            </button>

            <p
                id="errorMessage"
                class="hidden"
            ></p>

        </section>


        <!-- ==================================================
             LOADING SCREEN
             ================================================== -->

        <section
            id="loadingScreen"
            class="hidden"
        >
            <p>
                Loading your RPG data...
            </p>
        </section>


        <!-- ==================================================
             PLAYER HUB
             ================================================== -->

        <section id="playerScreen">

            <!-- PLAYER LOGIN INFORMATION -->

            <div class="player-header">

                <div class="player-info">

                    <div
                        id="playerName"
                        class="player-name"
                    ></div>

                    <div
                        id="playerEmail"
                        class="player-email"
                    ></div>

                </div>

                <button
                    id="signOutButton"
                    type="button"
                >
                    Sign Out
                </button>

            </div>


            <!-- ==================================================
                 NEW PLAYER MESSAGE
                 ================================================== -->

            <div
                id="newPlayerMessage"
                class="welcome-message"
            >
                <p>
                    <strong>Your RPG journey has not yet begun.</strong>
                </p>

                <p>
                    You must begin with the Birth Book.
                </p>
            </div>


            <!-- ==================================================
                 CHARACTER STATS
                 ALWAYS VISIBLE
                 ================================================== -->

            <section class="stats-section">

                <h2>Character Stats</h2>

                <div class="stats">

                    <!-- NAME -->

                    <div class="stat-card">

                        <div class="stat-label">
                            Name
                        </div>

                        <div
                            id="nameValue"
                            class="stat-value"
                        >
                            Not Established
                        </div>

                    </div>


                    <!-- COURT -->

                    <div class="stat-card">

                        <div class="stat-label">
                            Court
                        </div>

                        <div
                            id="courtValue"
                            class="stat-value"
                        >
                            Not Established
                        </div>

                    </div>


                    <!-- ESSENCE -->

                    <div class="stat-card">

                        <div class="stat-label">
                            Essence
                        </div>

                        <div
                            id="essenceValue"
                            class="stat-value"
                        >
                            Not Established
                        </div>

                    </div>


                    <!-- EXP -->

                    <div class="stat-card">

                        <div class="stat-label">
                            EXP
                        </div>

                        <div
                            id="expValue"
                            class="stat-value"
                        >
                            0
                        </div>

                    </div>


                    <!-- LEVEL -->

                    <div class="stat-card">

                        <div class="stat-label">
                            Lvl
                        </div>

                        <div
                            id="levelValue"
                            class="stat-value"
                        >
                            1
                        </div>

                    </div>

                </div>

            </section>


            <!-- ==================================================
                 AVAILABLE ACTIONS
                 ================================================== -->

            <section class="actions-section">

                <h2>Available</h2>

                <div
                    id="actionsContainer"
                    class="actions"
                ></div>

            </section>

        </section>

    </main>

</div>


<script type="module">

    /*
    ============================================================
    FIREBASE IMPORTS
    ============================================================
    */

    import {
        initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";

    import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        onAuthStateChanged,
        signOut
    } from
    "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

    import {
        getFirestore,
        doc,
        getDoc,
        setDoc,
        serverTimestamp
    } from
    "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";


    /*
    ============================================================
    FIREBASE CONFIGURATION
    ============================================================
    */

    const firebaseConfig = {

        apiKey:
            "AIzaSyAeyOzh9YHaQDMSvn-8-ZyVqXkwY_diL5Y",

        authDomain:
            "solus-dynasty-rpg.firebaseapp.com",

        projectId:
            "solus-dynasty-rpg",

        storageBucket:
            "solus-dynasty-rpg.firebasestorage.app",

        messagingSenderId:
            "136636530132",

        appId:
            "1:136636530132:web:6c77757f59f365be0c6a41",

        measurementId:
            "G-S6PXC09F52"
    };


    /*
    ============================================================
    INITIALIZE FIREBASE
    ============================================================
    */

    const firebaseApp =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(firebaseApp);

    const db =
        getFirestore(firebaseApp);

    const googleProvider =
        new GoogleAuthProvider();


    /*
    ============================================================
    DOM ELEMENTS
    ============================================================
    */

    const loginScreen =
        document.getElementById("loginScreen");

    const loadingScreen =
        document.getElementById("loadingScreen");

    const playerScreen =
        document.getElementById("playerScreen");

    const googleSignInButton =
        document.getElementById(
            "googleSignInButton"
        );

    const signOutButton =
        document.getElementById(
            "signOutButton"
        );

    const playerName =
        document.getElementById(
            "playerName"
        );

    const playerEmail =
        document.getElementById(
            "playerEmail"
        );

    const newPlayerMessage =
        document.getElementById(
            "newPlayerMessage"
        );

    const nameValue =
        document.getElementById(
            "nameValue"
        );

    const courtValue =
        document.getElementById(
            "courtValue"
        );

    const essenceValue =
        document.getElementById(
            "essenceValue"
        );

    const expValue =
        document.getElementById(
            "expValue"
        );

    const levelValue =
        document.getElementById(
            "levelValue"
        );

    const actionsContainer =
        document.getElementById(
            "actionsContainer"
        );

    const errorMessage =
        document.getElementById(
            "errorMessage"
        );


    /*
    ============================================================
    ERROR DISPLAY
    ============================================================
    */

    function showError(message) {

        errorMessage.textContent =
            message;

        errorMessage.classList.remove(
            "hidden"
        );
    }


    /*
    ============================================================
    CLEAR ERROR
    ============================================================
    */

    function clearError() {

        errorMessage.textContent = "";

        errorMessage.classList.add(
            "hidden"
        );
    }


    /*
    ============================================================
    SHOW LOGIN
    ============================================================
    */

    function showLogin() {

        loginScreen.style.display =
            "block";

        loadingScreen.classList.add(
            "hidden"
        );

        playerScreen.style.display =
            "none";
    }


    /*
    ============================================================
    SHOW LOADING
    ============================================================
    */

    function showLoading() {

        loginScreen.style.display =
            "none";

        loadingScreen.classList.remove(
            "hidden"
        );

        playerScreen.style.display =
            "none";
    }


    /*
    ============================================================
    SHOW PLAYER HUB
    ============================================================
    */

    function showPlayerHub() {

        loginScreen.style.display =
            "none";

        loadingScreen.classList.add(
            "hidden"
        );

        playerScreen.style.display =
            "block";
    }


    /*
    ============================================================
    CREATE / LOAD PLAYER RECORD
    ============================================================
    */

    async function getOrCreatePlayer(user) {

        const playerRef =
            doc(
                db,
                "players",
                user.uid
            );

        const snapshot =
            await getDoc(playerRef);


        /*
        --------------------------------------------------------
        NEW GOOGLE ACCOUNT
        --------------------------------------------------------
        */

        if (!snapshot.exists()) {

            const newPlayer = {

                googleUid:
                    user.uid,

                email:
                    user.email || "",

                displayName:
                    user.displayName || "",

                photoURL:
                    user.photoURL || "",

                createdAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()
            };

            await setDoc(
                playerRef,
                newPlayer
            );

            return newPlayer;
        }


        /*
        --------------------------------------------------------
        EXISTING GOOGLE ACCOUNT
        --------------------------------------------------------
        */

        return snapshot.data();
    }


    /*
    ============================================================
    RESET DISPLAY TO CURRENT SAVED STATE
    ============================================================
    */

    function updateStats(playerData) {

        /*
        --------------------------------------------------------
        NAME
        --------------------------------------------------------
        */

        nameValue.textContent =
            playerData.characterName ||
            "Not Established";


        /*
        --------------------------------------------------------
        COURT
        --------------------------------------------------------
        */

        courtValue.textContent =
            playerData.court ||
            "Not Established";


        /*
        --------------------------------------------------------
        ESSENCE
        --------------------------------------------------------
        */

        essenceValue.textContent =
            playerData.essenceType ||
            "Not Established";


        /*
        --------------------------------------------------------
        EXP
        --------------------------------------------------------
        */

        expValue.textContent =
            playerData.exp !== undefined
                ? String(playerData.exp)
                : "0";


        /*
        --------------------------------------------------------
        LEVEL
        --------------------------------------------------------
        */

        levelValue.textContent =
            playerData.level !== undefined
                ? String(playerData.level)
                : "1";
    }


    /*
    ============================================================
    CLEAR AVAILABLE ACTIONS
    ============================================================
    */

    function clearActions() {

        actionsContainer.innerHTML = "";
    }


    /*
    ============================================================
    ADD AVAILABLE ACTION
    ============================================================
    */

    function addAction(
        title,
        description,
        action
    ) {

        const button =
            document.createElement(
                "button"
            );

        button.type =
            "button";

        button.className =
            "action-button";

        const titleElement =
            document.createElement(
                "span"
            );

        titleElement.className =
            "action-title";

        titleElement.textContent =
            title;

        const descriptionElement =
            document.createElement(
                "span"
            );

        descriptionElement.className =
            "action-description";

        descriptionElement.textContent =
            description;

        button.appendChild(
            titleElement
        );

        button.appendChild(
            descriptionElement
        );

        button.addEventListener(
            "click",
            action
        );

        actionsContainer.appendChild(
            button
        );
    }


    /*
    ============================================================
    BUILD AVAILABLE MENU
    ============================================================
    */

    function buildAvailableMenu(playerData) {

        clearActions();


        /*
        --------------------------------------------------------
        NO BIRTH BOOK COMPLETED
        --------------------------------------------------------
        --------------------------------------------------------
        This means the player has not yet created their first
        character.
        --------------------------------------------------------
        */

        const birthBookCompleted =
            playerData.birthBookCompleted === true;


        if (!birthBookCompleted) {

            addAction(
                "Birth Book",
                "Begin the first step of your character's journey.",
                () => {

                    window.location.href =
                        "https://adequateremedy.github.io/BirthBook/";
                }
            );

            return;
        }


        /*
        --------------------------------------------------------
        BIRTH BOOK IS COMPLETE
        --------------------------------------------------------
        --------------------------------------------------------
        Additional activities will only appear when their
        specific unlock conditions have actually been saved.
        --------------------------------------------------------
        */


        if (
            playerData.comingOfAgeUnlocked === true &&
            playerData.comingOfAgeCompleted !== true
        ) {

            addAction(
                "Coming of Age",
                "Discover the character's Essence.",
                () => {

                    alert(
                        "Coming of Age is unlocked."
                    );
                }
            );
        }


        if (
            playerData.echoesUnlocked === true
        ) {

            addAction(
                "Echoes",
                "Daily-life activities available to this character.",
                () => {

                    alert(
                        "Echoes is unlocked."
                    );
                }
            );
        }


        if (
            playerData.experiencesUnlocked === true
        ) {

            addAction(
                "Experiences",
                "Character experiences available to this character.",
                () => {

                    alert(
                        "Experiences is unlocked."
                    );
                }
            );
        }

    }


    /*
    ============================================================
    BUILD PLAYER HUB
    ============================================================
    */

    function buildHub(
        user,
        playerData
    ) {

        /*
        --------------------------------------------------------
        PLAYER IDENTITY
        --------------------------------------------------------
        */

        playerName.textContent =
            user.displayName ||
            playerData.displayName ||
            "Player";

        playerEmail.textContent =
            user.email ||
            playerData.email ||
            "";


        /*
        --------------------------------------------------------
        UPDATE STATS
        --------------------------------------------------------
        */

        updateStats(
            playerData
        );


        /*
        --------------------------------------------------------
        NEW PLAYER MESSAGE
        --------------------------------------------------------
        */

        if (
            playerData.birthBookCompleted !== true
        ) {

            newPlayerMessage.classList.remove(
                "hidden"
            );

        } else {

            newPlayerMessage.classList.add(
                "hidden"
            );
        }


        /*
        --------------------------------------------------------
        AVAILABLE ACTIONS
        --------------------------------------------------------
        */

        buildAvailableMenu(
            playerData
        );
    }


    /*
    ============================================================
    GOOGLE SIGN-IN
    ============================================================
    */

    googleSignInButton.addEventListener(
        "click",
        async () => {

            clearError();

            googleSignInButton.disabled =
                true;

            googleSignInButton.textContent =
                "Signing in...";

            try {

                await signInWithPopup(
                    auth,
                    googleProvider
                );

            } catch (error) {

                console.error(
                    "Google sign-in error:",
                    error
                );

                let message =
                    "Google sign-in could not be completed.";

                if (
                    error &&
                    error.code
                ) {

                    message +=
                        `\n\nFirebase error: ${error.code}`;
                }

                showError(
                    message
                );

                googleSignInButton.disabled =
                    false;

                googleSignInButton.textContent =
                    "Sign in with Google";
            }
        }
    );


    /*
    ============================================================
    AUTHENTICATION STATE
    ============================================================
    */

    onAuthStateChanged(
        auth,
        async (user) => {

            if (!user) {

                googleSignInButton.disabled =
                    false;

                googleSignInButton.textContent =
                    "Sign in with Google";

                showLogin();

                return;
            }


            try {

                clearError();

                showLoading();

                const playerData =
                    await getOrCreatePlayer(
                        user
                    );

                buildHub(
                    user,
                    playerData
                );

                showPlayerHub();

            } catch (error) {

                console.error(
                    "RPG Hub loading error:",
                    error
                );

                showError(
                    "Your RPG data could not be loaded."
                );

                showLogin();
            }
        }
    );


    /*
    ============================================================
    SIGN OUT
    ============================================================
    */

    signOutButton.addEventListener(
        "click",
        async () => {

            clearError();

            try {

                await signOut(
                    auth
                );

            } catch (error) {

                console.error(
                    "Sign-out error:",
                    error
                );

                showError(
                    "Unable to sign out."
                );
            }
        }
    );

</script>

</body>
</html>
